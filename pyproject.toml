[project]
name = "fort-backend"
version = "0.1.0"
description = "Fort - white-label security management SaaS backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# Автогенерированные миграции не проходят через ручной стиль
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: Depends(...) в дефолтах аргументов — канонический паттерн FastAPI
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
